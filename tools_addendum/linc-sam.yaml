notes: >-
  NOT PRE-REGISTERED. Disclosed addendum column for the 2026-10 Meta Global AI
  Developer Hackathon: same crucible / spectra pins as the frozen `linc` column,
  but nerve is the hackathon build (LincForge/linc-nerve#249 at e4205bd,
  installed with the `[grounding]` extra) with SAM 3.1 visual grounding enabled
  (`nerve_ground`, `nerve_tap(prompt=...)`, `visual_grounding_hint`). Grounding

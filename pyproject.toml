[project]
name = "mobile-agent-bench"
version = "0.1.0"
description = "Reproducible benchmark harness for agent-operated mobile-device tooling (MCP)"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
bench = "mobile_agent_bench.runner:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mobile_agent_bench"]
